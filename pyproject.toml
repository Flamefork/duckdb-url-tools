[project]
name = "duckdb-url-tools"
version = "0.1.0"
description = "Python tooling: formatters, property/fuzz harness, benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=25.9.0",
    "clang-format==11.0.1",
    "cmake-format>=0.6.13",
    "duckdb>=1.5.4",
    "hypothesis>=6.100",
]

# Mirrors the black invocation in duckdb/scripts/format.py, which already formats the .py
# files under src/ and test/ — one standard for every Python file in the repo.
[tool.black]
target-version = ["py313"]
line-length = 120
skip-string-normalization = true
